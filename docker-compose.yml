services:
  postgres:
    image: postgres:16
    container_name: spotify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify_pw
      POSTGRES_DB: spotify_history
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotify -d spotify_history"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify_python
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: spotify_history
      PGUSER: spotify
      PGPASSWORD: spotify_pw
      DISCOGS_TOKEN: ${DISCOGS_TOKEN}
      DISCOGS_USER_AGENT: spotify_analytics/1.0
    volumes:
      - .:/app
    # keeps the container running so you can `docker compose exec python bash` in
    tty: true
    stdin_open: true

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    container_name: spotify_dbt
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: spotify_history
      PGUSER: spotify
      PGPASSWORD: spotify_pw
      DBT_PROFILES_DIR: /app
    volumes:
      - ./dbt:/app
    ports:
      - "8080:8080"
    # Regenerates and serves the docs site on every container start, so
    # http://localhost:8080 is available for as long as this container is
    # running. This only refreshes the docs -- run
    # `docker compose exec dbt dbt run` separately to (re)build models.
    command: sh -c "dbt docs generate && dbt docs serve --port 8080 --host 0.0.0.0"

volumes:
  pgdata:

